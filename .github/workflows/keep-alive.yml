name: Render Keep-Alive Ping

on:
  schedule:
    # Ping every 14 minutes to stay under Render's 15-minute idle spin-down
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend /api/health
        env:
          HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "RENDER_HEALTH_URL secret is not set; skipping ping."
            exit 0
          fi
          curl -fsS --max-time 15 "$HEALTH_URL"
