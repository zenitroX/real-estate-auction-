# ==============================================================================
# SKANDX Modular Security Headers Snippet
# Path: /etc/nginx/snippets/skandx-security-headers.conf
# ==============================================================================

# HTTP Strict Transport Security (HSTS): 2 years + subdomains + preload
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Clickjacking mitigation
add_header X-Frame-Options "SAMEORIGIN" always;

# Prevent MIME sniffing
add_header X-Content-Type-Options "nosniff" always;

# Referrer policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Feature & Hardware permissions
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Content Security Policy (Vite + React SPA + PDF Blob + Bank Auction CDNs)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://images.unsplash.com https://*.ibapi.in https://*.bankeauctions.com https://*.eauctions.gov.in https:; frame-src 'self' blob:; object-src 'self' blob:; connect-src 'self' https:; base-uri 'self'; form-action 'self';" always;
