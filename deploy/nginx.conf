# ==============================================================================
# SKANDX Production Reverse Proxy Configuration
# Hardened Nginx Architecture with TLS 1.3, Rate Limiting, & Backend Upstream
# ==============================================================================

user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # --------------------------------------------------------------------------
    # MIME Types & Basic Performance Tweaks
    # --------------------------------------------------------------------------
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;

    # --------------------------------------------------------------------------
    # Slowloris & Denial of Service (DoS) Mitigation Timeouts
    # --------------------------------------------------------------------------
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 65s;
    send_timeout 10s;
    reset_timedout_connection on;

    # Buffer Limits
    client_body_buffer_size 128k;
    client_max_body_size 10M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # --------------------------------------------------------------------------
    # Logging Configuration
    # --------------------------------------------------------------------------
    log_format production_json escape=json '{"time_local":"$time_local","remote_addr":"$remote_addr","request_method":"$request_method","request_uri":"$request_uri","status":$status,"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,"upstream_response_time":"$upstream_response_time","upstream_addr":"$upstream_addr","http_referrer":"$http_referer","http_user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log production_json buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # --------------------------------------------------------------------------
    # Gzip Compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/x-javascript application/xml application/xml+rss image/svg+xml font/woff2;

    # --------------------------------------------------------------------------
    # Backend Upstream Pool
    # --------------------------------------------------------------------------
    upstream backend_api {
        server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # Nginx Rate Limiting Zones (10MB holds ~160,000 unique IP states)
    # --------------------------------------------------------------------------
    # Strict rate limit for admin authentication endpoints (5 requests / min)
    limit_req_zone $binary_remote_addr zone=admin_login_zone:10m rate=5r/m;

    # General rate limit for public / general API endpoints (30 requests / sec)
    limit_req_zone $binary_remote_addr zone=api_general_zone:10m rate=30r/s;

    # Connection limit per remote IP
    limit_conn_zone $binary_remote_addr zone=addr_conn_zone:10m;

    # ==========================================================================
    # HTTP Server Block (Port 80): ACME Validation & Enforced HTTPS Redirect
    # ==========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name skandx.com www.skandx.com _;

        # ACME Let's Encrypt challenge exception for Certbot issuance & renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
            try_files $uri =404;
        }

        # Automated 301 permanent redirect to HTTPS for all domains
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================================================
    # HTTPS Server Block (Port 443): SSL Hardened, Security Headers, SPA & API
    # ==========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name skandx.com www.skandx.com;

        # Webroot for React Vite SPA build
        root /var/www/skandx/frontend/dist;
        index index.html;

        # Connection concurrency limit (max 50 concurrent connections per IP)
        limit_conn addr_conn_zone 50;

        # ----------------------------------------------------------------------
        # SSL / TLS Settings (Mozilla Modern Recommended Configuration)
        # ----------------------------------------------------------------------
        ssl_certificate /etc/letsencrypt/live/skandx.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/skandx.com/privkey.pem;

        # TLS Protocols: TLSv1.2 and TLSv1.3 only (SSLv2, SSLv3, TLS 1.0, 1.1 disabled)
        ssl_protocols TLSv1.2 TLSv1.3;

        # High-Security Modern Cipher Suites
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;

        # High-Performance SSL Session Cache
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling (Validates certificate revocation without client latency)
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/letsencrypt/live/skandx.com/chain.pem;
        resolver 1.1.1.1 8.8.8.8 9.9.9.9 valid=300s;
        resolver_timeout 5s;

        # ----------------------------------------------------------------------
        # Global Security Headers
        # ----------------------------------------------------------------------
        # Strict-Transport-Security (HSTS): 2 years with subdomains and preload eligibility
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Clickjacking defense (permit framing only by same origin)
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Prevent MIME-type sniffing
        add_header X-Content-Type-Options "nosniff" always;

        # Restrict Referrer information on cross-origin requests
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Restrict sensitive browser features
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Content-Security-Policy tuned for SKANDX:
        # - allows self, inline styles/scripts needed by Vite/React
        # - external images from bank CDNs/Unsplash/public sources
        # - blob: frame-src & object-src for the protected PDF notice viewer
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://images.unsplash.com https://*.ibapi.in https://*.bankeauctions.com https://*.eauctions.gov.in https:; frame-src 'self' blob:; object-src 'self' blob:; connect-src 'self' https:; base-uri 'self'; form-action 'self';" always;

        # ----------------------------------------------------------------------
        # Protected Admin Authentication Route (Strict Rate Limiting)
        # ----------------------------------------------------------------------
        location = /api/admin/login {
            limit_req zone=admin_login_zone burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        # ----------------------------------------------------------------------
        # Streaming PDF Proxy Route (Unbuffered Large Document Streaming)
        # ----------------------------------------------------------------------
        location /api/admin/pdf-proxy {
            # Dedicated chunked streaming settings
            proxy_buffering off;
            client_max_body_size 30M;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # General Backend API Routes (Standard Rate Limiting & Keepalive)
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_general_zone burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # ----------------------------------------------------------------------
        # Hashed Static Web Assets (/assets/) - 1 Year Immutable Cache
        # ----------------------------------------------------------------------
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            try_files $uri =404;
        }

        # Static media & fonts caching
        location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|otf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            try_files $uri =404;
        }

        # ----------------------------------------------------------------------
        # React Vite Single Page Application (SPA) Fallback Route
        # ----------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ----------------------------------------------------------------------
        # System Health Check Endpoint
        # ----------------------------------------------------------------------
        location /healthz {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ----------------------------------------------------------------------
        # Deny Hidden Files (.git, .env, etc.)
        # ----------------------------------------------------------------------
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
